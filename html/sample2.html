<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Step Process</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:600px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.progress-container{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:50px;
}

.progress-container::before{
    content:'';
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:4px;
    background:#2d6ea3;
    transform:translateY(-50%);
    z-index:1;
}

.step{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#2ecc71;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    position:relative;
    z-index:2;
}

.step.active{
    background:#fff;
    border:3px solid #2d6ea3;
}

.content h2{
    margin-bottom:10px;
}

.content p{
    color:#555;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.btn{
    padding:10px 20px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
}

.prev{
    background:#2d6ea3;
    color:white;
}

.next{
    background:#ddd;
    color:white;
    cursor:not-allowed;
}
</style>
</head>
<body>

<div class="container">
    <h1>Multi-Step Process</h1>

    <div class="progress-container">
        <div class="step">1</div>
        <div class="step">2</div>
        <div class="step">3</div>
        <div class="step active">4</div>
    </div>

    <div class="content">
        <h2>Step 4: Confirmation</h2>
        <p>Review and confirm your information.</p>
    </div>

    <div class="buttons">
        <button class="btn prev">Previous</button>
        <button class="btn next">Next</button>
    </div>
</div>

</body>
</html>
